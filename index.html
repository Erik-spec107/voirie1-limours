<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voirie Limours</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #0f6e56; --teal-lt: #e1f5ee;
      --bg: #f4f4f2; --card: #fff; --border: #dddbd4;
      --text: #1a1a18; --muted: #6b6b67;
      --red: #a32d2d; --red-lt: #fcebeb;
      --amber-lt: #faeeda; --amber: #854f0b;
    }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; }
    header { background: var(--teal); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 17px; font-weight: 600; }
    #hdr-count { font-size: 12px; opacity: .8; }
    #btn-export { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); }
    nav button { flex: 1; padding: 12px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; font-family: inherit; }
    nav button.active { color: var(--teal); border-bottom-color: var(--teal); }
    .page { display: none; padding: 12px 12px 48px; }
    .page.active { display: block; }
    .card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 14px; margin-bottom: 10px; }
    .card-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
    .btn-teal { width: 100%; padding: 12px; background: var(--teal); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
    #gps-info { font-size: 13px; color: var(--muted); padding: 8px; background: var(--bg); border-radius: 8px; margin-bottom: 10px; }
    .addr-row { display: grid; grid-template-columns: 1fr 80px; gap: 8px; }
    input[type=text] { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: var(--bg); color: var(--text); font-family: inherit; }
    input[type=text]:focus { outline: none; border-color: var(--teal); background: #fff; }
    .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tbtn { padding: 12px 8px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; font-family: inherit; text-align: center; line-height: 1.3; position: relative; -webkit-tap-highlight-color: transparent; }
    .tbtn.on { background: var(--teal-lt); border-color: var(--teal); color: var(--teal); }
    .tbtn.on::after { content: '✓'; position: absolute; top: 4px; right: 6px; font-size: 11px; }
    .grav-row { display: flex; gap: 6px; }
    .gbtn { flex: 1; padding: 12px 4px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 16px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; text-align: center; -webkit-tap-highlight-color: transparent; }
    .glbl { font-size: 10px; font-weight: 400; display: block; margin-top: 2px; }
    .gbtn.on[data-g="1"] { background: #e1f5ee; border-color: #1d9e75; color: #0f6e56; }
    .gbtn.on[data-g="2"] { background: #eaf3de; border-color: #639922; color: #3b6d11; }
    .gbtn.on[data-g="3"] { background: var(--amber-lt); border-color: #ba7517; color: var(--amber); }
    .gbtn.on[data-g="4"] { background: #faece7; border-color: #d85a30; color: #993c1d; }
    .gbtn.on[data-g="5"] { background: var(--red-lt); border-color: #e24b4a; color: var(--red); }
    #file-inp { display: none; }
    #photo-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; }
    #photo-prev { display: none; width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; border: 1.5px solid var(--border); }
    #btn-del-photo { display: none; margin-top: 8px; background: var(--red-lt); color: var(--red); border: 1px solid #f09595; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
    textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: var(--bg); color: var(--text); font-family: inherit; resize: none; height: 70px; }
    textarea:focus { outline: none; border-color: var(--teal); background: #fff; }
    #btn-save { display: block; width: 100%; margin-top: 4px; padding: 16px; background: #9FE1CB; color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: default; font-family: inherit; }
    #btn-save.ready { background: var(--teal); cursor: pointer; }
    #form-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a18; color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 14px; font-weight: 500; z-index: 999; transition: transform .3s; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .stats { display: flex; gap: 8px; margin-bottom: 12px; }
    .schip { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 11px; color: var(--muted); }
    .schip strong { display: block; font-size: 22px; font-weight: 700; color: var(--text); }
    .ditem { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
    .dthumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
    .dnophoto { width: 56px; height: 56px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .dbody { flex: 1; min-width: 0; }
    .dtype { font-weight: 600; font-size: 14px; }
    .dmeta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
    .gbadge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-left: 5px; }
    .g1{background:#e1f5ee;color:#0f6e56} .g2{background:#eaf3de;color:#3b6d11}
    .g3{background:var(--amber-lt);color:var(--amber)} .g4{background:#faece7;color:#993c1d}
    .g5{background:var(--red-lt);color:var(--red)}
    .ddel { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 4px; }
    .dsync { font-size: 11px; margin-top: 3px; }
    .dsync.ok { color: var(--teal); }
    .dsync.err { color: var(--red); }
    .dsync.pend { color: var(--amber); }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 15px; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: flex-end; justify-content: center; }
    #overlay.open { display: flex; }
    #modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 22px 18px 40px; width: 100%; max-width: 480px; }
    #modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    #modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .mbtn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; }
    /* Indicateur de sync en haut */
    #sync-bar { background: var(--teal-lt); border-bottom: 1px solid var(--border); padding: 6px 16px; font-size: 12px; color: var(--teal); display: none; text-align: center; }
    #sync-bar.err { background: var(--red-lt); color: var(--red); }
    #sync-bar.show { display: block; }
  </style>
</head>
<body>

<div id="sync-bar"></div>

<header>
  <div><h1>Voirie Limours</h1><span id="hdr-count">0 désordre</span></div>
  <button id="btn-export" onclick="openExport()">Envoyer ✉</button>
</header>
<nav>
  <button class="active" onclick="showPage('saisie',this)">＋ Saisie</button>
  <button onclick="showPage('liste',this)">Liste</button>
</nav>

<div id="page-saisie" class="page active">
  <div class="card">
    <div class="card-title">Position GPS</div>
    <button class="btn-teal" id="btn-gps" onclick="doGPS()">📍 Localiser automatiquement</button>
    <div id="gps-info">Position non enregistrée</div>
    <div class="addr-row" style="margin-top:10px;">
      <input type="text" id="f-rue" placeholder="Rue (facultatif)">
      <input type="text" id="f-num" placeholder="N°">
    </div>
  </div>

  <div class="card">
    <div class="card-title">Type de désordre — sélection multiple</div>
    <div class="type-grid">
      <button class="tbtn" onclick="toggleType(this)" data-t="Nid-de-poule">Nid-de-poule</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Fissure">Fissure / faïençage</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Affaissement">Affaissement</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Glissière / bordure">Glissière / bordure</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Marquage effacé">Marquage effacé</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Panneau manquant">Panneau manquant</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Accotement dégradé">Accotement dégradé</button>
      <button class="tbtn" onclick="toggleType(this)" data-t="Autre">Autre</button>
    </div>
    <input type="text" id="f-autre" placeholder="Préciser…" style="display:none; margin-top:8px;">
  </div>

  <div class="card">
    <div class="card-title">Gravité</div>
    <div class="grav-row">
      <button class="gbtn" data-g="1" onclick="selectGrav(this)">1<span class="glbl">Mineur</span></button>
      <button class="gbtn" data-g="2" onclick="selectGrav(this)">2<span class="glbl">Modéré</span></button>
      <button class="gbtn" data-g="3" onclick="selectGrav(this)">3<span class="glbl">Sérieux</span></button>
      <button class="gbtn" data-g="4" onclick="selectGrav(this)">4<span class="glbl">Grave</span></button>
      <button class="gbtn" data-g="5" onclick="selectGrav(this)">5<span class="glbl">Très grave</span></button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Photo</div>
    <input type="file" id="file-inp" accept="image/*" capture="environment" onchange="handlePhoto(event)">
    <div id="photo-zone" onclick="document.getElementById('file-inp').click()">📷 Prendre / choisir une photo</div>
    <img id="photo-prev" alt="aperçu">
    <button id="btn-del-photo" onclick="clearPhoto()">✕ Supprimer la photo</button>
  </div>

  <div class="card">
    <div class="card-title">Agent</div>
    <input type="text" id="f-agent" placeholder="Votre prénom / nom">
  </div>

  <div class="card">
    <div class="card-title">Commentaire (facultatif)</div>
    <textarea id="f-comment" placeholder="Observations…"></textarea>
  </div>

  <button id="btn-save" onclick="saveDesordre()">Enregistrer le désordre</button>
  <div id="form-hint">Sélectionnez au moins un type et une gravité</div>
</div>

<div id="page-liste" class="page">
  <div class="stats">
    <div class="schip"><strong id="s-total">0</strong>Total</div>
    <div class="schip"><strong id="s-graves">0</strong>Graves 4-5</div>
    <div class="schip"><strong id="s-today">0</strong>Aujourd'hui</div>
  </div>
  <div id="liste-content"></div>
</div>

<div id="overlay" onclick="closeExport()">
  <div id="modal" onclick="event.stopPropagation()">
    <h2>Envoyer la tournée</h2>
    <p id="modal-sub">—</p>
    <button class="mbtn" style="background:var(--teal);color:#fff" onclick="syncPending()">☁ Synchroniser avec Google Sheets</button>
    <button class="mbtn" style="background:#1a73e8;color:#fff" onclick="openSheet()">📊 Ouvrir Google Sheets</button>
    <button class="mbtn" style="background:#2e7d32;color:#fff" onclick="doCSV()">⬇ Télécharger le CSV</button>
    <button class="mbtn" style="background:#185fa5;color:#fff" onclick="doMail()">✉ Ouvrir le client mail</button>
    <button class="mbtn" style="background:var(--bg);border:1px solid var(--border)" onclick="closeExport()">Annuler</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ── CONFIG ──
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzn5NFmG7JGuVjNJYjxBClkkKDWCrj3InAYXKPVEiGIKaaN3veXAnyilM22R8UOYph7_g/exec';
var SHEET_URL  = 'https://docs.google.com/spreadsheets/d/1VnCwPnkN7C8lwZK4nX_e3uyB6ggznTcbo2ose94eSMk/edit';

// ── ÉTAT ──
var gLat = '', gLon = '';
var selTypes = [];
var selGrav = 0;
var photoB64 = '', photoNom = '';

// ── STOCKAGE LOCAL ──
function getDB() {
  try { return JSON.parse(localStorage.getItem('voirie_v5') || '[]'); }
  catch(e) { return []; }
}
function saveDB(db) {
  // On ne stocke plus les photos en base64 dans localStorage
  // Juste les métadonnées + statut de sync
  var light = [];
  for (var i = 0; i < db.length; i++) {
    var d = {}; for (var k in db[i]) d[k] = db[i][k];
    // On garde photo_b64 seulement si pas encore synchronisé
    if (d.synced) d.photo_b64 = '';
    light.push(d);
  }
  try {
    localStorage.setItem('voirie_v5', JSON.stringify(light));
  } catch(e) {
    // Si encore plein, on vire toutes les photos
    var ultralight = [];
    for (var j = 0; j < light.length; j++) {
      var d2 = {}; for (var k2 in light[j]) d2[k2] = light[j][k2];
      d2.photo_b64 = '';
      ultralight.push(d2);
    }
    try { localStorage.setItem('voirie_v5', JSON.stringify(ultralight)); } catch(e2) {}
    toast('⚠ Stockage local plein — synchronisez avec Google Sheets');
  }
}

// ── ENVOI VERS GOOGLE SHEETS ──
function sendToSheet(rec) {
  // Utilise no-cors pour éviter les blocages CORS de Google Apps Script
  return fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(rec)
  })
  .then(function() {
    // no-cors = on ne peut pas lire la réponse, on suppose que c'est ok
    var db = getDB();
    for (var i = 0; i < db.length; i++) {
      if (db[i].id === rec.id) {
        db[i].synced = true;
        db[i].photo_b64 = '';
        break;
      }
    }
    saveDB(db);
    return true;
  })
  .catch(function() { return false; });
}

// ── SYNC DES ENREGISTREMENTS EN ATTENTE ──
function syncPending() {
  var db = getDB();
  var pending = [];
  for (var i = 0; i < db.length; i++) {
    if (!db[i].synced) pending.push(db[i]);
  }
  if (!pending.length) {
    toast('✓ Tout est déjà synchronisé');
    closeExport();
    return;
  }
  showSyncBar('⏳ Synchronisation de ' + pending.length + ' désordre(s)…', false);
  closeExport();

  var idx = 0;
  function next() {
    if (idx >= pending.length) {
      showSyncBar('✓ ' + pending.length + ' désordre(s) synchronisé(s) !', false);
      setTimeout(function() { hideSyncBar(); }, 3000);
      renderListe();
      return;
    }
    sendToSheet(pending[idx]).then(function(ok) {
      if (!ok) {
        showSyncBar('⚠ Erreur de synchronisation — vérifiez votre connexion', true);
      }
      idx++;
      next();
    });
  }
  next();
}

function showSyncBar(msg, isErr) {
  var bar = document.getElementById('sync-bar');
  bar.textContent = msg;
  bar.className = 'show' + (isErr ? ' err' : '');
}
function hideSyncBar() {
  document.getElementById('sync-bar').className = '';
}

// ── NAVIGATION ──
function showPage(id, btn) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
  var btns = document.querySelectorAll('nav button');
  for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'liste') renderListe();
}

// ── GPS ──
function doGPS() {
  var info = document.getElementById('gps-info');
  var btn  = document.getElementById('btn-gps');
  info.textContent = '⏳ Localisation en cours…';
  info.style.color = 'var(--muted)';
  btn.textContent  = '⏳ Localisation…';
  btn.disabled     = true;
  if (!navigator.geolocation) {
    info.textContent = '⚠ GPS non disponible sur ce navigateur';
    info.style.color = 'var(--red)';
    btn.textContent  = '📍 Localiser automatiquement';
    btn.disabled     = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function(p) {
      gLat = p.coords.latitude.toFixed(6);
      gLon = p.coords.longitude.toFixed(6);
      var acc = Math.round(p.coords.accuracy);
      info.textContent = '✓ ' + gLat + ', ' + gLon + '  (±' + acc + 'm)';
      info.style.color = 'var(--teal)';
      btn.textContent  = '✓ Position enregistrée';
      btn.disabled     = false;
    },
    function(e) {
      var msgs = {1:'⚠ Permission refusée — autorisez la localisation dans Chrome', 2:'⚠ Position indisponible', 3:'⚠ Délai dépassé — réessayez en extérieur'};
      info.textContent = msgs[e.code] || '⚠ Erreur GPS';
      info.style.color = 'var(--red)';
      btn.textContent  = '📍 Réessayer';
      btn.disabled     = false;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ── TYPES ──
function toggleType(btn) {
  var t = btn.getAttribute('data-t');
  var found = false;
  for (var i = 0; i < selTypes.length; i++) {
    if (selTypes[i] === t) { selTypes.splice(i, 1); found = true; break; }
  }
  if (!found) selTypes.push(t);
  btn.classList.toggle('on', !found);
  var autreOn = false;
  for (var j = 0; j < selTypes.length; j++) { if (selTypes[j] === 'Autre') { autreOn = true; break; } }
  document.getElementById('f-autre').style.display = autreOn ? 'block' : 'none';
  checkForm();
}

// ── GRAVITÉ ──
function selectGrav(btn) {
  var btns = document.querySelectorAll('.gbtn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
  btn.classList.add('on');
  selGrav = parseInt(btn.getAttribute('data-g'), 10);
  checkForm();
}

// ── PHOTO ──
function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;
  photoNom = 'photo_' + Date.now() + '.jpg';
  // Compression avant stockage
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var MAX = 1200;
    var w = img.width, h = img.height;
    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
    if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    photoB64 = canvas.toDataURL('image/jpeg', 0.7);
    URL.revokeObjectURL(url);
    document.getElementById('photo-zone').style.display = 'none';
    document.getElementById('photo-prev').src = photoB64;
    document.getElementById('photo-prev').style.display = 'block';
    document.getElementById('btn-del-photo').style.display = 'inline-block';
  };
  img.src = url;
}
function clearPhoto() {
  photoB64 = ''; photoNom = '';
  document.getElementById('file-inp').value = '';
  document.getElementById('photo-zone').style.display = 'block';
  document.getElementById('photo-prev').style.display = 'none';
  document.getElementById('btn-del-photo').style.display = 'none';
}

// ── VALIDATION ──
function checkForm() {
  var ok = selTypes.length > 0 && selGrav > 0;
  document.getElementById('btn-save').classList.toggle('ready', ok);
  document.getElementById('form-hint').textContent = ok ? '✓ Prêt à enregistrer' : 'Sélectionnez au moins un type et une gravité';
}

// ── SAUVEGARDE ──
function saveDesordre() {
  if (selTypes.length === 0 || selGrav === 0) { toast('Sélectionnez un type et une gravité'); return; }

  var saveLat   = gLat;
  var saveLon   = gLon;
  var savePhoto = photoB64;
  var saveNom   = photoNom;
  var rue       = document.getElementById('f-rue').value.trim();
  var num       = document.getElementById('f-num').value.trim();
  var comment   = document.getElementById('f-comment').value.trim();
  var agent     = document.getElementById('f-agent').value.trim();
  var autre     = document.getElementById('f-autre').value.trim();
  var types     = [];
  for (var i = 0; i < selTypes.length; i++) {
    types.push(selTypes[i] === 'Autre' && autre ? autre : selTypes[i]);
  }
  var now = new Date();
  var rec = {
    id:          now.getTime(),
    date:        now.toLocaleDateString('fr-FR'),
    heure:       now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
    lat:         saveLat,
    lon:         saveLon,
    rue:         rue,
    numero:      num,
    types:       types,
    gravite:     selGrav,
    commentaire: comment,
    photo_b64:   savePhoto,
    photo_nom:   saveNom,
    photo_url:   '',
    synced:      false,
    agent:       agent
  };

  var db = getDB();
  db.push(rec);
  saveDB(db);
  updateHeader();
  resetForm();

  // Envoi immédiat si connecté
  showSyncBar('⏳ Envoi vers Google Sheets…', false);
  sendToSheet(rec).then(function(ok) {
    if (ok) {
      showSyncBar('✓ Enregistré et synchronisé !', false);
      setTimeout(hideSyncBar, 3000);
      toast('✓ Désordre enregistré et synchronisé !');
    } else {
      showSyncBar('⚠ Sauvegardé localement — à synchroniser plus tard', true);
      setTimeout(hideSyncBar, 4000);
      toast('✓ Désordre sauvegardé (sync en attente)');
    }
    renderListe();
  });
}

// ── RESET ──
function resetForm() {
  gLat = ''; gLon = '';
  selTypes = []; selGrav = 0;
  photoB64 = ''; photoNom = '';

  var info = document.getElementById('gps-info');
  info.textContent = 'Position non enregistrée';
  info.style.color = 'var(--muted)';
  var btn = document.getElementById('btn-gps');
  btn.textContent = '📍 Localiser automatiquement';
  btn.disabled = false;

  document.getElementById('f-rue').value = '';
  document.getElementById('f-num').value = '';

  var tbuts = document.querySelectorAll('.tbtn');
  for (var i = 0; i < tbuts.length; i++) tbuts[i].classList.remove('on');
  document.getElementById('f-autre').style.display = 'none';
  document.getElementById('f-autre').value = '';

  var gbuts = document.querySelectorAll('.gbtn');
  for (var j = 0; j < gbuts.length; j++) gbuts[j].classList.remove('on');

  clearPhoto();
  document.getElementById('f-comment').value = '';
  document.getElementById('f-agent').value = '';
  document.getElementById('btn-save').classList.remove('ready');
  document.getElementById('form-hint').textContent = 'Sélectionnez au moins un type et une gravité';
  window.scrollTo(0, 0);
}

// ── HEADER ──
function updateHeader() {
  var n = getDB().length;
  document.getElementById('hdr-count').textContent = n + (n > 1 ? ' désordres' : ' désordre');
}

// ── LISTE ──
function renderListe() {
  var db = getDB().slice().reverse();
  var today = new Date().toLocaleDateString('fr-FR');
  var graves = 0, todays = 0;
  for (var i = 0; i < db.length; i++) {
    if (db[i].gravite >= 4) graves++;
    if (db[i].date === today) todays++;
  }
  document.getElementById('s-total').textContent  = db.length;
  document.getElementById('s-graves').textContent = graves;
  document.getElementById('s-today').textContent  = todays;
  var el = document.getElementById('liste-content');
  if (!db.length) { el.innerHTML = '<div class="empty">🛣 Aucun désordre enregistré</div>'; return; }
  var html = '';
  for (var j = 0; j < db.length; j++) {
    var d = db[j];
    var addr = '';
    if (d.numero) addr += d.numero + ' ';
    if (d.rue)    addr += d.rue;
    if (!addr)    addr = d.lat ? d.lat + ', ' + d.lon : 'Position non renseignée';
    var types = Array.isArray(d.types) ? d.types.join(' · ') : (d.type || '—');
    var thumb = d.photo_b64
      ? '<img class="dthumb" src="' + d.photo_b64 + '" alt="">'
      : (d.photo_url
        ? '<img class="dthumb" src="' + d.photo_url + '" alt="">'
        : '<div class="dnophoto">🛣</div>');
    var syncLabel = d.synced
      ? '<div class="dsync ok">☁ Synchronisé</div>'
      : '<div class="dsync pend">⏳ En attente de sync</div>';
    html += '<div class="ditem">' + thumb
      + '<div class="dbody"><div class="dtype">' + types
      + '<span class="gbadge g' + d.gravite + '">' + d.gravite + '</span></div>'
      + '<div class="dmeta">' + addr + '<br>' + d.date + ' à ' + d.heure
      + (d.commentaire ? '<br><em>' + d.commentaire + '</em>' : '')
      + '</div>' + syncLabel + '</div>'
      + '<button class="ddel" onclick="delItem(' + d.id + ')">✕</button></div>';
  }
  el.innerHTML = html;
}

function delItem(id) {
  var db = getDB();
  var db2 = [];
  for (var i = 0; i < db.length; i++) { if (db[i].id !== id) db2.push(db[i]); }
  saveDB(db2);
  renderListe();
  updateHeader();
  toast('Supprimé');
}

// ── EXPORT ──
function openExport() {
  var db = getDB();
  if (!db.length) { toast('Aucun désordre à envoyer'); return; }
  var pending = 0;
  for (var i = 0; i < db.length; i++) { if (!db[i].synced) pending++; }
  document.getElementById('modal-sub').textContent = db.length + ' désordre(s), ' + pending + ' non synchronisé(s).';
  document.getElementById('overlay').classList.add('open');
}
function closeExport() { document.getElementById('overlay').classList.remove('open'); }

function openSheet() {
  window.open(SHEET_URL, '_blank');
  closeExport();
}

function buildCSV(db) {
  var cols = ['id','date','heure','lat','lon','rue','numero','types','gravite','commentaire','photo_url','synced'];
  var lines = [cols.join(',')];
  for (var i = 0; i < db.length; i++) {
    var d = db[i], row = [];
    for (var j = 0; j < cols.length; j++) {
      var c = cols[j];
      var v = c === 'types'
        ? (Array.isArray(d.types) ? d.types.join(' | ') : '')
        : String(d[c] != null ? d[c] : '');
      v = v.replace(/"/g, '""');
      if (/[,\n"]/.test(v)) v = '"' + v + '"';
      row.push(v);
    }
    lines.push(row.join(','));
  }
  return lines.join('\n');
}

function doCSV() {
  var db    = getDB();
  var today = new Date().toLocaleDateString('fr-FR').replace(/\//g, '-');
  var blob  = new Blob(['\uFEFF' + buildCSV(db)], { type: 'text/csv;charset=utf-8;' });
  var url   = URL.createObjectURL(blob);
  var a     = document.createElement('a');
  a.href = url; a.download = 'voirie_limours_' + today + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  closeExport(); toast('CSV téléchargé ✓');
}

function doMail() {
  var db    = getDB();
  var today = new Date().toLocaleDateString('fr-FR');
  var grav  = 0;
  for (var i = 0; i < db.length; i++) { if (db[i].gravite >= 4) grav++; }
  var lines = '', start = db.length > 15 ? db.length - 15 : 0;
  for (var j = start; j < db.length; j++) {
    var d = db[j];
    var t = Array.isArray(d.types) ? d.types.join('+') : '';
    var a = (d.numero ? d.numero + ' ' : '') + (d.rue || '') || (d.lat ? d.lat + ',' + d.lon : '?');
    lines += d.date + ' ' + d.heure + ' | G' + d.gravite + ' | ' + t + ' | ' + a + '\n';
  }
  var subj = encodeURIComponent('Désordres voirie Limours — ' + today);
  var body = encodeURIComponent('Tournée du ' + today + '\n' + db.length + ' désordre(s), ' + grav + ' graves.\n\nLien Google Sheets :\n' + SHEET_URL + '\n\nRésumé :\n' + lines);
  window.location.href = 'mailto:?subject=' + subj + '&body=' + body;
  closeExport();
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2800);
}

updateHeader();
</script>
